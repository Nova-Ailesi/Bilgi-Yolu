name: bilgi_yolu
description: "Türkiye'nin %100 Ücretsiz, Açık Kaynak Sınav ve Eğitim Hazırlık Platformu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4

  # Local Persistence & Offline Storage (Hive NoSQL)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Network & Background Task Worker
  http: ^1.2.1
  workmanager: ^0.5.2

  # Monetization (Google AdMob - %100 Ücretsiz Kullanıcı Modeli)
  google_mobile_ads: ^6.0.0

  # UI / UX / Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3

  # Firebase Auth
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0

  # Cryptography (SHA-256 for Zero Duplication)
  crypto: ^3.0.3

  # Utilities & Virality Features
  flutter_tts: ^4.0.2
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/bilgi_yolu.png"
  min_sdk_android: 21
  adaptive_icon_background: "#002366"
  adaptive_icon_foreground: "assets/images/bilgi_yolu.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
